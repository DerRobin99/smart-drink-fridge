# OPTIONAL AND SECURITY-SENSITIVE.
# Read "Updates from the web interface" and "Optional Raspberry Pi power
# controls" in README.md before enabling this file. The same socket mount is
# required for one-click updates and optional host restart/power-off controls.
services:
  web:
    environment:
      DOCKER_UPDATE_ENABLED: "true"
    volumes:
      # Docker socket access effectively grants root control over the host.
      - /var/run/docker.sock:/var/run/docker.sock
