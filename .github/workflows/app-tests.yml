name: App Tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: app-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app-tests:
    name: Docker smoke and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Build application image
        run: docker build --tag smart-drink-fridge:test .

      - name: Run application tests
        run: |
          mkdir -p coverage
          docker run --rm \
            --volume "$PWD/tests:/tests:ro" \
            --volume "$PWD/coverage:/coverage" \
            --workdir /app \
            smart-drink-fridge:test \
            sh -c 'pip install --disable-pip-version-check coverage==7.15.2 && \
              python3 -m coverage run --source=/app \
                --omit="/app/tests/*" /tests/app_smoke_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/app_route_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/nfc_unit_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/nextion_display_unit_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/scanner_booking_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/services_unit_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/advanced_routes_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/remaining_logic_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/error_branches_test.py && \
              python3 -m coverage run --append --source=/app \
                --omit="/app/tests/*" /tests/scanner_camera_test.py && \
              python3 -m coverage xml -o /coverage/coverage.xml && \
              python3 -m coverage report'

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          use_oidc: true
          files: ./coverage/coverage.xml
          disable_search: true
          fail_ci_if_error: true
