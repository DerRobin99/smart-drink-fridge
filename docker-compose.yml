services:

  web:
    image: ghcr.io/derrobin99/smart-drink-fridge:latest
    container_name: smart-drink-fridge-web
    restart: unless-stopped
    command: python3 app.py

    ports:
      - "5000:5000"

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/getraenke.db
      STORNO_PASSWORT: ${STORNO_PASSWORT}
      SECRET_KEY: ${SECRET_KEY}
      UPDATE_CHECKER_ENABLED: ${UPDATE_CHECKER_ENABLED:-true}
      DOCKER_UPDATE_ENABLED: ${DOCKER_UPDATE_ENABLED:-false}
      DOCKER_CONTAINER_NAME: smart-drink-fridge-web
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}

    volumes:
      - fridge-data:/data
      - ./backups:/data/backups
      - ./translations:/app/translations:ro

  # Optional:
  # Start with:
  # docker compose --profile scanner up -d
  scanner:
    profiles:
      - scanner

    image: ghcr.io/derrobin99/smart-drink-fridge:latest
    container_name: smart-drink-fridge-scanner
    restart: unless-stopped
    command: python3 scanner.py

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/getraenke.db
      SECRET_KEY: ${SECRET_KEY}
      PUSHOVER_USER: ${PUSHOVER_USER:-}
      PUSHOVER_TOKEN: ${PUSHOVER_TOKEN:-}

    volumes:
      - fridge-data:/data
      - ./translations:/app/translations:ro

    devices:
      - /dev/video0:/dev/video0

    privileged: true

  # Optional PC/SC NFC reader such as the ACS ACR122U.
  # Start with:
  # docker compose --profile scanner --profile nfc up -d
  nfc:
    profiles:
      - nfc

    image: ghcr.io/derrobin99/smart-drink-fridge:latest
    container_name: smart-drink-fridge-nfc
    restart: unless-stopped
    command: python3 nfc_reader.py

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/getraenke.db
      SECRET_KEY: ${SECRET_KEY}

    volumes:
      - fridge-data:/data
      - /dev/bus/usb:/dev/bus/usb

    privileged: true

  # Optional read-only Nextion status display (tested: NX4832K035).
  # Start with:
  # docker compose --profile scanner --profile nfc --profile display up -d
  display:
    profiles:
      - display

    image: ghcr.io/derrobin99/smart-drink-fridge:latest
    container_name: smart-drink-fridge-display
    restart: unless-stopped
    command: python3 nextion_display.py

    env_file:
      - .env

    environment:
      DATABASE_PATH: /data/getraenke.db
      NEXTION_PORT: ${NEXTION_PORT:-/dev/serial0}
      NEXTION_BAUD: ${NEXTION_BAUD:-9600}
      NEXTION_USER_SECONDS: ${NEXTION_USER_SECONDS:-120}
      NEXTION_LANGUAGE: ${NEXTION_LANGUAGE:-de}

    volumes:
      - fridge-data:/data

    devices:
      - ${NEXTION_PORT:-/dev/serial0}:${NEXTION_PORT:-/dev/serial0}

  # Optional:
  # Start with:
  # docker compose --profile tailscale up -d
  tailscale:
    profiles:
      - tailscale

    image: tailscale/tailscale:latest
    container_name: smart-drink-fridge-tailscale
    hostname: ${TAILSCALE_HOSTNAME:-smart-drink-fridge}
    restart: unless-stopped

    environment:
      TS_AUTHKEY: ${TAILSCALE_AUTHKEY}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "false"

    volumes:
      - tailscale-state:/var/lib/tailscale

    network_mode: host

    cap_add:
      - NET_ADMIN
      - SYS_MODULE

    devices:
      - /dev/net/tun:/dev/net/tun

volumes:
  fridge-data:
  tailscale-state:
